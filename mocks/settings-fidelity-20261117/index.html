<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0e11;color:#e9ebef;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,system-ui,sans-serif}

.count{display:inline-flex;gap:8px;align-items:center;font-weight:600}
.count b{font-size:20px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid #1d2026}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa0aa;margin:0 0 6px}
.frame{background:#15171b;border:1px solid #23262c;border-radius:12px;overflow:hidden;aspect-ratio:3/2;position:relative}
.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.frame.tall img{object-fit:contain;background:#0f1114}
.ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#7f8590;font-size:14px;text-align:center;padding:20px;border:1px dashed #333842;border-radius:12px}
.frame.missing img,.frame.missing a.zoom{display:none}.frame.missing .ph{display:flex}
.ph code{color:#aab0ba;font-size:12px}
.frame a.zoom{position:absolute;right:8px;bottom:8px;font-size:12px;color:#cfe0ff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;text-decoration:none}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid #20232a;vertical-align:top}
th{color:#9aa0aa;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td:first-child{font-weight:600;color:#fff;width:17%}
td.v{white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px}
.MOCK{background:#173a6b;color:#bcd6ff}.BUILD{background:#2a2d33;color:#c5c9d1}.NEW{background:#123326;color:#79d9a9}
.hidebuild tr.b{display:none}
label.tg{font-size:13px;color:#b9bec7;display:inline-flex;gap:6px;align-items:center;margin-left:auto}

ce"}, {"element": "Shortened titles (e.g. \"Time format\")", "mock": "Shown", "built": "n/a", "verdict": "NEW", "reason": "Search shows the same title as the row, and the old registry title still matches as a keyword"}, {"element": "ADV result while Advanced is off", "mock": "Turns Advanced on, with a toast", "built": "Asks first in a consent dialog", "verdict": "BUILD", "reason": "Explicit and reversible"}]}, {"id": "display", "title": "Display & Brightness", "rows": [{"element": "Appearance", "mock": "Two 220×146 previews, Light and Dark, with radio rings", "built": "\"Appearance\" value row → dialog list", "verdict": "MOCK", "reason": "1 tap instead of 3; the previews read from 3 m"}, {"element": "Appearance footer", "mock": "\"Same switch as the old header button…\"", "built": "none", "verdict": "BUILD", "reason": "The mock's footer is a migration note, not product copy"}, {"element": "Brightness", "mock": "Title and value above a full-width slider", "built": "Label (240 dp) + slider + value on one row", "verdict": "BUILD", "reason": "Same control and same reach; works today"}, {"element": "Auto-brightness subtitle", "mock": "\"Follows the room using the light sensor.\"", "built": "none (the footer explains it)", "verdict": "BUILD", "reason": "The footer already says it"}, {"element": "Night Shift From / Until", "mock": "Value rows \"21:00\" › time editor", "built": "Inline ± steppers (30 min steps), \"9:00 PM\"", "verdict": "MOCK", "reason": "Consistent with every other time row (quiet hours, overnight, alarm), 24-hour labels, any minute reachable"}, {"element": "Warmth", "mock": "Slider", "built": "± stepper (10 % steps)", "verdict": "MOCK", "reason": "A level is a slider everywhere else (brightness, volume); 1 drag instead of up to 10 taps"}, {"element": "Clock (time format)", "mock": "\"Time format\", segmented Auto/12-hour/24-hour", "built": "\"Clock\" → list", "verdict": "MOCK", "reason": "1 tap; the clearer name says what it changes"}, {"element": "Hide status bar (ADV)", "mock": "Switch", "built": "Same", "verdict": "BUILD", "reason": "Identical"}]}, {"id": "sounds", "title": "Sounds", "rows": [{"element": "Media volume", "mock": "Slider", "built": "Slider + footer", "verdict": "BUILD", "reason": "Same"}, {"element": "Chime volume", "mock": "\"Chime & voice volume\" slider in the Volume section", "built": "\"Volume\" → stepper dialog (10 % steps) in Chimes", "verdict": "MOCK", "reason": "A level should be a slider, and the name no longer clashes with Media volume. It stays inside the chime editor, so its saving and status logic is unchanged"}, {"element": "Touch section header", "mock": "\"Touch\"", "built": "\"Options\"", "verdict": "MOCK", "reason": "Says what the section is"}, {"element": "Test touch sound", "mock": "Row + \"Tap to test\"", "built": "Same (plus state-aware help)", "verdict": "BUILD", "reason": "Built is richer"}, {"element": "Hourly / Spoken / Golden-hour subtitles", "mock": "Spoken: \"Says the time after the chime.\", Golden: \"A gentle tone before sunset.\"", "built": "none (Advanced off)", "verdict": "MOCK", "reason": "Clarity. The copy is accurate to the build: golden hour sounds at sunrise **and** sunset"}, {"element": "Sunrise sound", "mock": "Value row (Birdsong, Bells…)", "built": "0–1 stepper dialog \"Morning/Rooster\"", "verdict": "NEW", "reason": "Two built options → two one-tap tiles. The mock's option names don't exist in the build"}, {"element": "Preview sounds", "mock": "2 buttons", "built": "Up to 5 buttons + voice picker + status", "verdict": "BUILD", "reason": "More useful"}, {"element": "Quiet hours", "mock": "Own section with switch and two times", "built": "Same rows inside the chime editor", "verdict": "BUILD", "reason": "Equivalent, and keeps the editor's write queue"}, {"element": "Ambient sound", "mock": "Value row → list", "built": "Same", "verdict": "BUILD", "reason": "7 options; a list is right"}, {"element": "Soundscape volume", "mock": "Slider", "built": "Stepper di t": "Clock when the room is dark", "mock": "Switch", "built": "Same", "verdict": "BUILD", "reason": "Same"}, {"element": "Night clock brightness", "mock": "Slider", "built": "1–15 % stepper dialog", "verdict": "MOCK", "reason": "A level is a slider"}, {"element": "Night clock colour", "mock": "Segmented Warm/Red/White", "built": "Warm/Red list", "verdict": "MOCK (control) / BUILD (options)", "reason": "1 tap. \"White\" doesn't exist in the renderer, and adding it would change behaviour"}, {"element": "Darkness threshold (ADV)", "mock": "Value row", "built": "Same", "verdict": "BUILD", "reason": "Same"}, {"element": "Sleep timer rows", "mock": "Inside a card: countdown, \"Sleep after\" list, switches", "built": "Countdown card, then **loose rows** outside any card (Material switches, ◀ \"30m\" ▶ stepper)", "verdict": "MOCK", "reason": "Consistent card and switches. The ◀▶ stepper needed 6 taps to go from 30 to 60 minutes"}, {"element": "Sleep after", "mock": "Value row → 15/30/45 min/1/2 hours", "built": "◀▶ ±5 min", "verdict": "NEW", "reason": "Tiles 15 min / 30 min / 1 hour / 2 hours + Custom: 1 tap, any 1–240 still reachable. A running timer still restarts at the new length"}, {"element": "Power (ADV)", "mock": "Power list, Idle screen-off, Sleep on battery", "built": "Same", "verdict": "BUILD", "reason": "\"Follow presence\" is too long for a tile; the list stays"}, {"element": "Lamp", "mock": "Open Lamp ↗", "built": "Same", "verdict": "BUILD", "reason": "Same"}]}, {"id": "wallpaper", "title": "Wallpaper", "rows": [{"element": "Preview on mini Home", "mock": "Yes", "built": "Yes", "verdict": "BUILD", "reason": "Same"}, {"element": "Swatches", "mock": "Grid with names, LIVE badges", "built": "Same grid (14 options, photo presets) + selected label", "verdict": "BUILD", "reason": "Equivalent"}, {"element": "\"Background\" / \"Effects\" headers", "mock": "Two sections", "built": "One card with Film grain under a divider", "verdict": "BUILD", "reason": "Same content; const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const vclass = v => v.startsWith('MOCK') ? 'MOCK' : v.startsWith('NEW') ? 'NEW' : 'BUILD';
document.getElementById('cm').textContent = DATA.counts.MOCK;
document.getElementById('cb').textContent = DATA.counts.BUILD;
document.getElementById('cn').textContent = DATA.counts.NEW;
const live = id => id === 'sidebar' ? 'display' : id === 'search' ? 'display&q=clock' : id;
function shot(kind, id, title, tall) {
  const src = `./${kind}/${id}.png`;
  return `<div class="frame ${tall ? 'tall' : ''}"><img loading="lazy" src="${src}" alt="${esc(title)} — ${kind}" onerror="this.parentElement.classList.add('missing')">
    <div class="ph">Screenshot not captured yet<code>${src}</code></div><a class="zoom" href="${src}" target="_blank">open</a></div>`;
}
document.getElementById('nav').innerHTML = DATA.pages.map(p => {
  const n = p.rows.filter(r => vclass(r.verdict) !== 'BUILD').length;
  return `<a href="#${p.id}">${esc(p.title)}${n ? ` · ${n}` : ''}</a>`; }).join('');
document.getElementById('main').innerHTML = DATA.pages.map(p => {
  const changed = p.rows.filter(r => vclass(r.verdict) !== 'BUILD').length;
  return `<section id="${p.id}"><h2>${esc(p.title)}</h2>
    <div class="sub">${changed} changed · ${p.rows.length - changed} kept · <a style="color:#8fbcff" href="../settings-redesign-20261109/split-view/index.html#page=${live(p.id)}" target="_blank">open the live mock</a></div>
    <div class="cols">
      <div class="col"><h3>Mock</h3>${shot('mock', p.id, p.title, true)}</div>
      <div class="col"><h3>Built (before)</h3>${shot('built', p.id, p.title)}</div>
      <div class="col"><h3>Final</h3>${shot('final', p.id, p.title)}</div>
    </div>
    <table><thead><tr><th>Element</th><th>Mock</th><th>Built (before)</th><th>Verdict</th><th>Why</th></tr></thead><tbody>
    ${p.rows.map(r => `<tr class="${vclass(r.verdict) === 'BUILD' ? 'b' : ''}"><td>${md(r.element)}</td><td>${md(r.mock)}</td><td>${md(r.built)}</td>
      <td class="v"><span class="tag ${vclass(r.verdict)}">${esc(r.verdict)}</span></td><td>${md(r.reason)}</td></tr>`).join('')}
    </tbody></table></section>`; }).join('');
document.getElementById('hb').addEventListener('change', e => document.getElementById('main').classList.toggle('hidebuild', e.target.checked));
</script>
</body>
</html>
