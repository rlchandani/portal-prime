<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dusk Aurora · Folder</title>
<link rel="stylesheet" href="aurora.css"/>
<style>
/* dimmed, extra-blurred home behind the folder */
#dim{position:fixed;inset:0;background:rgba(4,6,12,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5}
/* ghost of the home grid so the blur has something to chew on */
#ghost{position:fixed;inset:42px 0 0 0;display:flex;gap:48px;padding:26px 40px 0;opacity:.9}
#ghost .col{width:452px}
#ghost .g{border-radius:24px;background:rgba(22,26,38,.5);height:130px;margin-bottom:16px}
#ghost .grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:30px 22px;align-content:start}
#ghost .t{width:96px;height:96px;border-radius:25px;margin:0 auto}

#fwrap{position:fixed;inset:0;z-index:10;display:grid;place-items:center}
#folder{width:820px;
  border-radius:34px;padding:30px 36px 38px;
  background:rgba(28,32,46,.6);backdrop-filter:blur(44px) saturate(1.6);-webkit-backdrop-filter:blur(44px) saturate(1.6);
  border:.5px solid rgba(255,255,255,.16);
  box-shadow:0 .5px 0 rgba(255,255,255,.25) inset,0 40px 110px -20px rgba(0,0,0,.9)}
#folder .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
#folder .name{font-size:24px;font-weight:700;letter-spacing:-.4px}
#folder .close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:rgba(255,255,255,.8)}
#folder .close svg{width:16px;height:16px}
#fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 20px}
.app{display:flex;flex-direction:column;align-items:center;gap:10px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:30px}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots .on{background:#fff}
</style>
</head>
<body>
<div id="sky"></div><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div id="stars"></div><div id="grain"></div>
<div id="status"><div>Immortal</div><div>Saturday, August 1</div><div>65°&ensp;100%</div></div>
<div class="badge" style="z-index:40">MOCK 03 v3 · FOLDER</div>

<div id="ghost">
  <div class="col"><div class="g" style="height:130px"></div><div class="g" style="height:200px"></div><div class="g" style="height:120px"></div><div class="g" style="height:200px"></div></div>
  <div class="grid" id="ggrid"></div>
</div>
<div id="dim"></div>

<div id="fwrap"><div id="folder" class="up">
  <div class="head"><div class="name">Tools</div><div class="close" id="cx"></div></div>
  <div id="fgrid"></div>
  <div class="dots"><span class="on"></span><span></span></div>
</div></div>

<script src="aurora-icons.js"></script>
<script>
document.getElementById("ggrid").innerHTML=[G.green,G.purple,G.blue,G.indigo,G.gray,G.orange,G.blue,G.red,G.teal,G.orange,G.orange,G.cyan]
  .map(g=>`<div class="t" style="background:${g};opacity:.75"></div>`).join("");
document.getElementById("cx").innerHTML=I.x;
const T=[
 ["Calculator",G.slate,I.calc],["Timer",G.orange,I.timer],["Notes",G.yellow,I.notes],["QR Share",G.gray,I.qr],
 ["Intercom",G.green,I.megaphone],["Bedtime",G.indigo,I.moonz],["Countdowns",G.pink,I.hourglass],["Casting",G.blue,I.tv],
];
document.getElementById("fgrid").innerHTML=T.map(([l,g,s],i)=>
 `<div class="app up" style="animation-delay:${.06+i*.03}s">${tile(g,s)}<div class="applbl">${l}</div></div>`).join("");
</script>
</body>
</html>
