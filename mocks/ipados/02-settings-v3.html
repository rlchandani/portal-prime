<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dusk Aurora · Settings (functional)</title>
<link rel="stylesheet" href="aurora.css"/>
<style>
/* ================= SHELL ================= */
#panel{position:fixed;inset:64px 40px 28px;display:flex;border-radius:28px;overflow:hidden;
  border:.5px solid rgba(255,255,255,.14);
  box-shadow:0 .5px 0 rgba(255,255,255,.2) inset,0 30px 80px -24px rgba(0,0,0,.85)}
#side{width:400px;background:rgba(14,17,26,.74);backdrop-filter:blur(40px) saturate(1.5);
  -webkit-backdrop-filter:blur(40px) saturate(1.5);padding:22px 14px;overflow-y:auto;flex:none;
  border-right:.5px solid rgba(255,255,255,.08)}
#side h1{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 8px 14px}
#detail{flex:1;background:rgba(22,26,38,.55);backdrop-filter:blur(40px) saturate(1.5);
  -webkit-backdrop-filter:blur(40px) saturate(1.5);display:flex;flex-direction:column;min-width:0}
#dhead{padding:24px 34px 12px;border-bottom:.5px solid rgba(255,255,255,.09);flex:none}
#dhead .t{font-size:26px;font-weight:700;letter-spacing:-.4px}
#dhead .s{font-size:13.5px;color:var(--t-secondary);margin-top:4px;line-height:1.45;max-width:760px}
#dbody{flex:1;overflow-y:auto;padding:18px 34px 44px}
.dmax{max-width:780px}

/* sidebar rows */
.slbl{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--t-tertiary);margin:16px 10px 5px}
.srow{display:flex;align-items:center;gap:11px;padding:7.5px 10px;border-radius:10px;font-size:14.5px;font-weight:500;cursor:pointer;user-select:none}
.srow:hover{background:rgba(255,255,255,.05)}
.srow.sel{background:var(--blue)}
.badge2{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:700}
.badge2 svg{width:16px;height:16px}
.srow .out{margin-left:auto;color:rgba(255,255,255,.35);font-size:13px}
.sres{padding:9px 10px;border-radius:10px;cursor:pointer}
.sres:hover{background:rgba(255,255,255,.05)}
.sres .n{font-size:14.5px;font-weight:550}.sres .w{font-size:12px;color:var(--t-tertiary)}
.nores{color:var(--t-tertiary);font-size:13.5px;padding:10px}

/* ================= COMPONENTS ================= */
.card{background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.08);border-radius:15px;overflow:visible;margin-bottom:6px}
.grouplbl{margin:20px 0 7px 14px}
.rowc{display:flex;align-items:center;gap:12px;padding:11px 15px;min-height:52px;position:relative;font-size:15px}
.rowc+.rowc::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:rgba(255,255,255,.09)}
.rowc.nob::before{left:15px}
.rowc .rt{flex:1;font-weight:500;min-width:0}
.rowc .rt .sub{font-size:12.5px;color:var(--t-tertiary);font-weight:400;margin-top:1px;line-height:1.35}
.rowc .rv{color:var(--t-tertiary);font-size:14px;white-space:nowrap}
.rowc .chev{color:rgba(255,255,255,.28);font-size:17px;font-weight:600}
.rowc.tap{cursor:pointer}.rowc.tap:hover{background:rgba(255,255,255,.03)}
.help{font-size:12.5px;color:var(--t-tertiary);line-height:1.4;padding:0 15px 10px 15px;margin-top:-5px}
.foot{font-size:12.5px;color:var(--t-tertiary);line-height:1.5;padding:8px 14px 0;margin-bottom:14px}
.switch{cursor:pointer}
.badge3{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;font-size:14px;font-weight:700}
.badge3 svg{width:17px;height:17px}
/* segmented */
.seg{cursor:pointer;flex:none}
.seg div{cursor:pointer;white-space:nowrap}
/* stepper */
.stp{display:flex;align-items:center;gap:2px;flex:none}
.stp button{width:34px;height:31px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:var(--cyan);
  font-size:16px;font-weight:700;cursor:pointer}
.stp button:hover{background:rgba(255,255,255,.16)}
.stp .v{min-width:64px;text-align:center;font-size:14px;font-weight:550;font-variant-numeric:tabular-nums}
/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;max-width:300px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}
/* dropdown */
.dd{position:relative;flex:none}
.ddbtn{color:var(--t-tertiary);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px}
.ddbtn:hover{color:#fff}
.ddmenu{position:absolute;right:0;top:26px;z-index:50;min-width:210px;border-radius:13px;overflow:hidden;
  background:rgba(34,39,54,.97);backdrop-filter:blur(30px);border:.5px solid rgba(255,255,255,.14);
  box-shadow:0 18px 44px -10px rgba(0,0,0,.8)}
.ddmenu div{padding:9px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.ddmenu div:hover{background:rgba(255,255,255,.08)}
.ddmenu .on{font-weight:650}
.ddmenu .on::after{content:"✓";color:var(--cyan)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:10px 18px;
  font-size:14.5px;font-weight:650;cursor:pointer;border:none;font-family:inherit}
.btn.blue{background:var(--blue);color:#fff}.btn.blue:hover{filter:brightness(1.1)}
.btn.grey{background:rgba(255,255,255,.1);color:#fff}
.btn.red{background:#ff453a;color:#fff}
.btn.orange{background:#ef6c00;color:#fff}
.btn.wide{width:100%;padding:12px}
.pill{background:rgba(100,210,255,.14);color:var(--cyan);border-radius:10px;padding:6px 13px;font-size:13px;font-weight:650;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill:hover{background:rgba(100,210,255,.22)}
/* text field */
.tf{background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;
  font-family:inherit;font-size:14px;padding:9px 12px;outline:none;width:100%}
.tf:focus{border-color:var(--blue)}
.tf::placeholder{color:rgba(255,255,255,.3)}
.tf.inline{width:200px;text-align:right;background:transparent;border:none;padding:4px 0}
/* radio */
.radio{width:20px;height:20px;border-radius:50%;border:1.8px solid rgba(255,255,255,.35);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--blue)}
.radio.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--blue)}
/* check */
.ck{color:var(--cyan);font-weight:800;font-size:16px}
/* day chips */
.days{display:flex;gap:9px}
.day{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.1)}
.day.on{background:var(--blue)}
/* wallpaper swatches */
.sw{display:flex;gap:11px;overflow-x:auto;padding:4px 2px 6px}
.swi{flex:none;text-align:center;cursor:pointer;width:64px}
.swi .b{width:60px;height:60px;border-radius:13px;border:2.5px solid transparent;box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.swi.on .b{border-color:var(--cyan)}
.swi .l{font-size:10.5px;margin-top:5px;color:var(--t-tertiary)}
.swi.on .l{color:var(--cyan);font-weight:650}
/* emoji chips */
.emo{display:flex;gap:8px;flex-wrap:wrap}
.emo div{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;cursor:pointer;background:rgba(255,255,255,.08)}
.emo div.on{background:rgba(10,132,255,.35);outline:1.5px solid var(--blue)}
/* health */
.hbanner{border-radius:13px;padding:12px 16px;font-size:14px;font-weight:550;margin-bottom:14px}
.hbanner.ok{background:rgba(48,209,88,.14);color:#4cd964}
.hrow{display:flex;gap:12px;padding:11px 15px;position:relative;align-items:flex-start}
.hrow+.hrow::before{content:"";position:absolute;top:0;left:44px;right:0;height:.5px;background:rgba(255,255,255,.09)}
.hrow .ic{color:#4cd964;font-weight:800;font-size:15px;width:18px;flex:none;padding-top:1px}
.hrow .t{font-weight:600;font-size:14.5px}.hrow .e{font-size:12.5px;color:var(--t-tertiary);margin-top:2px;line-height:1.4}
/* steps list */
.steps{padding:4px 15px 13px}
.steps div{display:flex;gap:9px;font-size:13px;color:var(--t-secondary);line-height:1.5;margin-top:7px}
.steps b{color:var(--cyan);font-weight:700;flex:none}
/* status line */
.status{color:var(--cyan);font-size:13.5px;padding:2px 15px 12px}
/* subpage overlay */
#sub{position:fixed;inset:64px 40px 28px;z-index:60;border-radius:28px;display:none;flex-direction:column;
  background:rgba(13,16,25,.92);backdrop-filter:blur(50px) saturate(1.5);-webkit-backdrop-filter:blur(50px) saturate(1.5);
  border:.5px solid rgba(255,255,255,.16);box-shadow:0 40px 110px -20px rgba(0,0,0,.95)}
#sub.open{display:flex}
#subhead{padding:20px 34px 12px;flex:none;border-bottom:.5px solid rgba(255,255,255,.09)}
#subhead .back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:11px;
  padding:7px 15px;font-size:14px;font-weight:600;color:var(--cyan);cursor:pointer;margin-bottom:12px}
#subhead .t{font-size:26px;font-weight:700;letter-spacing:-.4px}
#subhead .s{font-size:13.5px;color:var(--t-secondary);margin-top:4px;max-width:720px;line-height:1.45}
#subbody{flex:1;overflow-y:auto;padding:18px 34px 44px}
/* mode/face preview thumbs */
.mth{width:88px;height:56px;border-radius:9px;flex:none;position:relative;overflow:hidden;background:#0a0e18;border:.5px solid rgba(255,255,255,.12)}
/* toast */
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);z-index:99;opacity:0;
  background:rgba(30,35,50,.95);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.16);color:#fff;
  padding:11px 22px;border-radius:14px;font-size:14px;font-weight:550;transition:.25s;pointer-events:none;
  box-shadow:0 16px 40px -10px rgba(0,0,0,.8)}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="sky"></div><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div id="stars"></div><div id="grain"></div>
<div id="status"><div>Immortal</div><div>Saturday, August 1</div><div>65°&ensp;100%</div></div>
<div class="badge" style="z-index:70">MOCK 02 v4 · SETTINGS — FUNCTIONAL REPLICA</div>

<div id="panel">
  <div id="side">
    <h1>Settings</h1>
    <div class="search" style="margin:0 2px 10px"><span id="schic"></span><input id="q" class="tf" style="background:none;border:none;padding:2px 0;font-size:14.5px" placeholder="Search"/></div>
    <div id="nav"></div>
  </div>
  <div id="detail">
    <div id="dhead"><div class="t" id="dt"></div><div class="s" id="ds"></div></div>
    <div id="dbody"><div class="dmax" id="dc"></div></div>
  </div>
</div>

<div id="sub">
  <div id="subhead"><div class="back" onclick="popPage()">‹ Back</div><div class="t" id="st"></div><div class="s" id="ss"></div></div>
  <div id="subbody"><div class="dmax" id="sc"></div></div>
</div>
<div id="toast"></div>

<script src="aurora-icons.js"></script>
<script>
/* =========================================================
   STATE — mirrors the real Config objects & defaults
   ========================================================= */
const S = {
  section:"Screensaver", sub:null, subCtx:null,
  // screensaver domain
  ss:{enabled:true, mode:"shuffle", face:"immortal-classic", facesOn:true, faceSize:1,
      source:"default", folderPath:"", albumUrl:"", albumRefresh:60,
      fit:"fill", intervalSec:30, shuffle:true, includeVideo:false, cacheEnabled:false,
      showNowPlaying:true, presenceMode:"ALWAYS_ON", idleSleepMin:0,
      overnightEnabled:false, overnightStart:23*60, overnightEnd:6*60, nightClock:false,
      sleepTimerEnabled:false, sleepTimerMin:30, pauseAudioOnSleep:true, closeAppOnSleep:false,
      soundscape:"off", soundscapeVolume:50, ambientDashboard:false, gestureWave:false, welcomeEnabled:true,
      dismiss:"Immortal launcher", haDash:"",
      immich:{connected:false,url:"",key:"",album:""}, smb:{connected:false,host:"",share:"",folder:"",user:""},
      dav:{connected:false,url:"",user:""}, web:{url:""}},
  // digital clock domain
  dc:{enabled:false, face:"classic", size:"medium", layout:"center", background:"black", showDate:true, showSeconds:false},
  // immortal domain
  im:{weatherUnit:"auto", tileSize:"standard", weatherWidget:"off", clockFormat:"auto",
      showMiniPlayer:true, hideStatusBar:true, multiRoomEnabled:false, snapcastHost:"", maPort:8095, maUser:"", maPass:"", maAuthed:false},
  // chime
  ch:{hourly:false, spoken:false, golden:false, sunriseVariant:0, volume:60, quiet:false, quietStart:22*60, quietEnd:7*60, voice:"Default voice"},
  // sunrise
  sr:{enabled:false, hour:7, minute:0, ramp:20, chime:true, days:[1,2,3,4,5]},
  // welcome
  wl:{greet:true, clock:true, date:true, tts:false, voice:"Default voice", name:"",
      gNight:"Good night", gMorning:"Good morning", gAfternoon:"Good afternoon", gEvening:"Good evening",
      durMs:3200, textSize:"Medium", opacity:70},
  // display
  dp:{brightness:70, autoBright:true, mediaVol:40, nightShift:false, nsFrom:21*60, nsTo:7*60, warmth:45},
  touchSounds:false,
  wp:{mode:"Sky", grain:false},
  cal:{url:"", widgetOn:true, range:"week", size:1, side:"right"},
  wc:{picked:["New York","London","Tokyo"]},
  cd:{list:[{name:"Mom's birthday", emoji:"🎂", m:3, d:12, yearly:true}], form:{name:"",emoji:"🎂",m:8,d:1,yearly:true,year:2027}},
  qb:{enabled:false, alwaysShow:false},
  mq:{enabled:false, host:"", port:1883, user:"", pass:"", tls:false, status:"Starting…"},
  boot:{apps:{"Home Assistant":false,"Jellyfin":false,"Music Assistant":false,"Snapcast":true,"VLC":false,"NewPipe":false}},
  fleet:{name:"Living Room"},
  debug:false, sleepCountdown:null,
};
const VOICES=["Default voice","Kokoro af_heart · English (US) · HQ+","Piper en_US-lessac · HQ","Female voice 1 · US · HQ"];
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const h12=m=>{let h=Math.floor(m/60),mm=m%60,ap=h<12?"AM":"PM";h=h%12||12;return `${h}:${String(mm).padStart(2,"0")} ${ap}`};
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800)};
const ENGINE=m=>m!=="classic";

/* =========================================================
   SIDEBAR — exact groups/rows/colors from ImmortalSettingsActivity
   ========================================================= */
const NAVROWS=[
 ["g","SOUND & WAKE"],
 ["Chime","#FF9F0A","bell"],["Sunrise & Wake","#FFD60A","sun"],["Multi-room Audio","#30D158","music"],
 ["Welcome Greeting","#FF375F","hand"],["Touch Sounds","#30D158","touch"],
 ["g","GENERAL"],
 ["Display","#FF9F0A","display"],["Screensaver","#FF6B35","photo"],["Wallpaper","#5E5CE6","wall"],
 ["Clock Face","#0A84FF","clock"],["Appearance","#5E5CE6","appear"],["Weather","#0A84FF","weather"],["Sleep Timer","#636366","moon"],
 ["g","WIDGETS & CONTENT"],
 ["Calendar","#FF453A","cal"],["World Clock","#0A84FF","globe"],["Countdown","#FF9F0A","hour"],["Quick Buttons","#5E5CE6","grid"],
 ["g","CONNECTIONS & DEVICE"],
 ["Home Assistant","#41BDF5","home"],["Phone Remote","#0A84FF","qr"],["Start on Boot","#636366","boot"],
 ["Device Name","#636366","info"],["About & Device Health","#636366","health"],
 ["g","SYSTEM"],
 ["All Android Settings","#636366","gear","out"],
];
const NAVIC={bell:I.bell,sun:I.display,music:I.music,hand:I.hand,touch:I.hand,display:I.display,photo:I.photo,
 wall:I.photo,clock:I.clock,appear:I.gridapps,weather:I.weather,moon:I.moonz,cal:I.cal,globe:I.globe,hour:I.hourglass,
 grid:I.gridapps,home:I.homeS,qr:I.qr,boot:I.plug,info:I.info,health:I.lock,wifi:I.wifi,bt:I.bt,folder:I.folder,gear:I.gear};
const SUBTITLES={
 "Chime":"Gentle ambient cues. All off by default; nothing plays during quiet hours.",
 "Sunrise & Wake":"Wake to a gradual screen-brightening ramp on the days you choose, optionally finishing with a chime.",
 "Multi-room Audio":"Show the Snapcast group's track on the now-playing card, with play/pause/skip.",
 "Welcome Greeting":"The greeting overlay shown when the screensaver starts — text, clock, date and spoken greeting.",
 "Sleep Timer":"Turn the screensaver off after a set time, with a live countdown; optionally pause audio and close apps.",
 "Countdown":"Add days-until countdowns (birthdays, trips) shown on the home screen.",
 "World Clock":"Choose the cities shown by the World Clock widget (the first four in pick order).",
 "Home Assistant":"Publish this Portal to Home Assistant as auto-discovered entities over your MQTT broker.",
 "Start on Boot":"Pick which installed apps Immortal relaunches after a reboot.",
};
const SEARCH_INDEX={ // alias → section (real index from ImmortalSettingsActivity)
 "Brightness":"Display","Auto-brightness":"Display","Night Shift":"Display","Volume":"Display","Media volume":"Display",
 "Photo Source":"Screensaver","Photo Interval":"Screensaver","Shuffle":"Screensaver","Include Video":"Screensaver",
 "Fit Mode":"Screensaver","Presence Mode":"Screensaver","Overnight screen-off":"Screensaver","Idle screen-off":"Screensaver",
 "Store media on this device":"Screensaver","Ambient dashboard":"Screensaver","Gesture wave to wake":"Screensaver",
 "Clock Face":"Clock Face","Clock Format":"Clock Face","Clock style":"Clock Face","Font":"Clock Face","Glow":"Clock Face",
 "Show Date":"Clock Face","Show Now Playing":"Clock Face","Show Seconds":"Clock Face",
 "Tile Size":"Appearance","Weather Widget":"Appearance","Show Mini Player":"Appearance","Hide Status Bar":"Appearance",
 "Temperature Unit":"Weather","Ambient sound":"Chime","Hourly chime":"Chime","Quiet hours":"Chime",
 "Sunrise alarm":"Sunrise & Wake","Music Assistant":"Multi-room Audio","Snapcast":"Multi-room Audio",
 "Touch sounds":"Touch Sounds","Calendar feed":"Calendar","World clock cities":"World Clock","Countdown events":"Countdown",
 "App-switcher button":"Quick Buttons","Home Assistant":"Home Assistant","MQTT":"Home Assistant",
 "Phone remote":"Phone Remote","Start on boot":"Start on Boot","Device name":"Device Name",
 "About":"About & Device Health","Device health":"About & Device Health","Debug Mode":"About & Device Health",
 "Wallpaper":"Wallpaper","Film grain":"Wallpaper","Sleep timer":"Sleep Timer",
};
function renderNav(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const nav=document.getElementById("nav");
  if(q){
    const names=[...new Set([...NAVROWS.filter(r=>r[0]!=="g").map(r=>r[0]),...Object.keys(SEARCH_INDEX)])];
    const hits=names.filter(n=>n.toLowerCase().includes(q));
    nav.innerHTML=hits.length?hits.map(n=>{
      const sec=SEARCH_INDEX[n]||n;
      return `<div class="sres" onclick="go('${sec.replace(/'/g,"\\'")}');document.getElementById('q').value='';renderNav()">
        <div class="n">${n}</div><div class="w">${sec}</div></div>`;
    }).join(""):`<div class="nores">No results for “${q}”</div>`;
    return;
  }
  nav.innerHTML=NAVROWS.map(r=>{
    if(r[0]==="g")return `<div class="slbl">${r[1]}</div>`;
    const [t,c,ic,out]=r;
    const sel=S.section===t&&!out;
    return `<div class="srow ${sel?'sel':''}" onclick="${out?`toast('Opens Android ${t} settings ↗')`:`go('${t}')`}">
      <div class="badge2" style="background:${sel?'rgba(255,255,255,.25)':c}">${NAVIC[ic]||t[0]}</div>
      <span>${t}</span>${out?'<span class="out">↗</span>':''}</div>`;
  }).join("");
}
function go(sec){S.section=sec;render()}

/* =========================================================
   COMPONENT BUILDERS
   ========================================================= */
const esc=s=>String(s).replace(/"/g,"&quot;");
let uid=0;const H=[];  // deferred handlers
function on(fn){H.push(fn);return `H[${H.length-1}]()`}
function onv(fn){H.push(fn);return `H[${H.length-1}](this.value)`}
const badge=(c,g)=>`<div class="badge3" style="background:${c}">${g}</div>`;
const lbl=t=>`<div class="grouplbl slbl" style="margin-left:14px">${t}</div>`;
const card=inner=>`<div class="card">${inner}</div>`;
const foot=t=>`<div class="foot">${t}</div>`;
const help=t=>t?`<div class="help">${t}</div>`:"";
function tgl(title,val,set,opts={}){
  return `<div class="rowc tap ${opts.nob?'nob':''}" onclick="${on(()=>{set(!val);render()})}">
    ${opts.badge||""}<div class="rt">${title}${opts.sub?`<div class="sub">${opts.sub}</div>`:""}</div>
    <div class="switch ${val?'on':''}"></div></div>${help(opts.help)}`;
}
function seg(title,val,options,set,opts={}){
  return `<div class="rowc nob">${opts.badge||""}<div class="rt">${title}</div>
    <div class="seg">${options.map(([k,l])=>`<div class="${k===val?'on':''}" onclick="${on(()=>{set(k);render()})}">${l}</div>`).join("")}</div>
  </div>${help(opts.help)}`;
}
function stp(title,valLabel,dec,inc,opts={}){
  return `<div class="rowc nob">${opts.badge||""}<div class="rt">${title}</div>
    <div class="stp"><button onclick="${on(()=>{dec();render()})}">−</button>
    <div class="v">${valLabel}</div><button onclick="${on(()=>{inc();render()})}">+</button></div></div>${help(opts.help)}`;
}
function nav2(title,val,click,opts={}){
  return `<div class="rowc tap ${opts.nob?'nob':''}" onclick="${on(click)}">${opts.badge||""}
    <div class="rt">${title}${opts.sub?`<div class="sub">${opts.sub}</div>`:""}</div>
    <span class="rv">${val||"Not set"}</span><span class="chev">›</span></div>${help(opts.help)}`;
}
function picker(title,val,options,set,opts={}){
  const id="dd"+(uid++);
  return `<div class="rowc nob">${opts.badge||""}<div class="rt">${title}</div>
    <div class="dd"><div class="ddbtn" onclick="document.getElementById('${id}').style.display='block';event.stopPropagation()">${options.find(o=>o[0]===val)?.[1]||val} <span style="font-size:11px">▾</span></div>

function slider(title,val,min,max,set,suffix="%"){
  return `<div class="rowc nob"><div class="rt" style="flex:0 0 120px">${title}</div>
    <input type="range" min="${min}" max="${max}" value="${val}" oninput="${onv(v=>{set(+v);render()})}"/>

}
function radio(title,sub,sel,click,icon=""){
  return `<div class="rowc tap nob" onclick="${on(click)}">${icon}
    <div class="rt">${title}${sub?`<div class="sub">${sub}</div>`:""}</div>
    <div class="radio ${sel?'on':''}"></div></div>`;
}
function field(ph,val,set,opts={}){
  return `<div style="padding:8px 15px">${opts.label?`<div style="font-size:12px;color:var(--t-tertiary);margin-bottom:5px">${opts.label}</div>`:""}
    <input class="tf" type="${opts.pass?'password':'text'}" placeholder="${esc(ph)}" value="${esc(val)}" onchange="${onv(v=>{set(v);render()})}"/></div>`;
}

"Countdown"(){ const c=S.cd;

     <button class="btn red" style="padding:6px 12px" onclick="${on(()=>{c.list.splice(i,1);render()})}">✕</button></div>`).join(""));

      `<div class="${f.emoji===e?'on':''}" onclick="${on(()=>{f.emoji=e;render()})}">${e}</div>`).join("")}</div></div>`+
    stp("Month",String(f.m),()=>{f.m=f.m<=1?12:f.m-1},()=>{f.m=f.m>=12?1:f.m+1})+
    stp("Day",String(f.d),()=>{f.d=f.d<=1?31:f.d-1},()=>{f.d=f.d>=31?1:f.d+1})+
    tgl("Repeats every year",f.yearly,v=>f.yearly=v)+

    `<div style="padding:8px 15px 14px"><button class="btn blue wide" onclick="${on(()=>{if(!f.name)return toast("Give it a name first");c.list.push({name:f.name,emoji:f.emoji,m:f.m,d:f.d,yearly:f.yearly,year:f.year});f.name="";render()})}">Add countdown</button></div>`);

function daysUntil(e){const now=new Date(2026,7,1);let t=new Date(e.yearly?2026:e.year,e.m-1,e.d);if(e.yearly&&t<now)t=new Date(2027,e.m-1,e.d);return Math.max(0,Math.round((t-now)/864e5))}
function srcLabel(){const c=S.ss;return {default:"Immortal photos",folder:"Local folder",album:"Shared album",immich:"Immich",smb:"Network share",dav:"WebDAV",web:"Web page"}[c.source]}
function tickSleep(){if(S.sleepCountdown===null)return;setTimeout(()=>{if(S.sleepCountdown===null)return;S.sleepCountdown--;if(S.sleepCountdown<=0){S.sleepCountdown=null;toast("Timer done — pausing audio, screen off")}if(S.section==="Sleep Timer")render();tickSleep()},1000)}

albumurl:{t:"Shared Album Link",s:"Paste a public link from iCloud Shared Albums or Google Photos. Make sure it's shared as \"anyone with the link\" — Immortal can't sign in.",
  render(){ const c=S.ss;
    const prov=c.albumUrl.includes("icloud")?"iCloud":c.albumUrl.includes("google")||c.albumUrl.includes("goo.gl")?"Google Photos":null;
    return card(field("https://photos.icloud.com/shared/album/…",c.albumUrl,v=>c.albumUrl=v)+
      `<div style="padding:0 15px 10px;font-size:13px;color:${c.albumUrl?(prov?"#4cd964":"#ff8a80"):"var(--t-tertiary)"}">${c.albumUrl?(prov?`Looks like a ${prov} link.`:"That doesn't look like a supported share link yet."):"Examples: iCloud Shared Album, Google Photos shared album."}</div>`)+
      `<div style="display:flex;gap:10px;margin:10px 0 18px"><button class="btn ${prov?'blue':'grey'}" onclick="${on(()=>{if(!prov)return;c.source="album";popPage()})}">Use this album</button>
      <button class="btn grey" onclick="popPage()">Cancel</button></div>`+
      `<div style="font-size:13px;color:var(--t-tertiary);line-height:1.6"><b style="color:var(--t-secondary)">How to get a link:</b><br/>
      • iPhone Photos: open the shared album → People tab → Share Link.<br/>
      • Google Photos: open the album → ⋮ → Share → Get link.</div>`;
  }},
calurl:{t:"Calendar Link",s:"Paste a private iCalendar (.ics) link from Google Calendar or Apple iCloud. Immortal reads it directly — it can't sign in to your account.",
  render(){ const c=S.cal;
    const ok=/\.ics(\?|$)|calendar\.google|icloud\.com/.test(c.url)&&/^(https?|webcal):\/\//.test(c.url);
    const prov=c.url.includes("google")?"Google Calendar":c.url.includes("icloud")?"Apple iCloud":null;
    return card(field("https://calendar.google.com/calendar/ical/…/basic.ics",c.url,v=>c.url=v)+
      `<div style="padding:0 15px 10px;font-size:13px;color:${c.url?(ok?"#4cd964":"#ff8a80"):"var(--t-tertiary)"}">${c.url?(ok?`Looks like a ${prov||"calendar"} link.`:"That doesn't look like a calendar (.ics) link yet."):"Examples: Google “secret address in iCal format”, Apple iCloud public calendar."}</div>`)+
      `<div style="display:flex;gap:10px;margin:10px 0 18px"><button class="btn ${ok?'blue':'grey'}" onclick="${on(()=>{if(ok)popPage()})}">Use this calendar</button>
      ${c.url?`<button class="btn grey" style="color:#ff8a80" onclick="${on(()=>{c.url="";popPage()})}">Remove calendar</button>`:""}
      <button class="btn grey" onclick="popPage()">Cancel</button></div>`+
      `<div style="font-size:13px;color:var(--t-tertiary);line-height:1.6"><b style="color:var(--t-secondary)">How to get a link:</b><br/>
      • Google Calendar: Settings → your calendar → “Integrate calendar” → “Secret address in iCal format” (keep it private).<br/>
      • Apple iCloud: Calendar → share icon → “Public Calendar” → Copy Link (webcal:// works too).</div>`;
  }},
dismiss:{t:"Open When Dismissed",s:"Choose what opens when you tap the screensaver to wake the Portal.",
  render(){ const c=S.ss;
    const APPS=["Home Assistant","Jellyfin","Music Assistant","NewPipe","VLC"];
    let out=lbl("HOME ASSISTANT")+card(
      radio("Home Assistant","Open your Home Assistant dashboard on tap.",c.dismiss==="Home Assistant",()=>{c.dismiss="Home Assistant";render()},
        `<div class="badge3" style="background:#41BDF5">${I.homeS.replace('currentColor','#fff')}</div>`)+
      (c.dismiss==="Home Assistant"?field("today-home/security",c.haDash,v=>c.haDash=v,{label:"Dashboard"})+
        help("The path after your Home Assistant address (e.g. lovelace/0). Leave blank to open your default dashboard."):""));
    out+=lbl("OR AN APP")+card(
      radio("Immortal launcher","Return to your home screen (default).",c.dismiss==="Immortal launcher",()=>{c.dismiss="Immortal launcher";render()},
        `<div class="badge3" style="background:#0A84FF">∞</div>`)+
      APPS.filter(a=>a!=="Home Assistant").map((a,i)=>radio(a,"",c.dismiss===a,()=>{c.dismiss=a;popPage()},
        `<div class="badge3" style="background:${["#5E5CE6","#FF9F0A","#FF453A","#FF6B35"][i]}">${a[0]}</div>`)).join(""));
    return out;
  }},

/* =========================================================
   ROUTER & RENDER
   ========================================================= */
const stack=[];
function push(p){stack.push(p);render()}
function popPage(){stack.pop();render()}
function render(){
  H.length=0;uid=0;
  renderNav();
  document.getElementById("dt").textContent=S.section;
  document.getElementById("ds").textContent=SUBTITLES[S.section]||"";
  document.getElementById("ds").style.display=SUBTITLES[S.section]?"block":"none";
  const body=document.getElementById("dbody");
  const keep=body.scrollTop;
  document.getElementById("dc").innerHTML=SECTIONS[S.section]?SECTIONS[S.section]():"";
  body.scrollTop=keep;
  const sub=document.getElementById("sub");
  if(stack.length){
    const p=SUBPAGES[stack[stack.length-1]];
    sub.classList.add("open");
    document.getElementById("st").textContent=p.t;
    document.getElementById("ss").textContent=p.s;
    document.getElementById("sc").innerHTML=p.render();
  } else sub.classList.remove("open");
}
document.addEventListener("click",()=>document.querySelectorAll(".ddmenu").forEach(m=>m.style.display="none"));
document.getElementById("q").addEventListener("input",renderNav);
document.getElementById("schic").innerHTML=I.search;
render();
</script>
