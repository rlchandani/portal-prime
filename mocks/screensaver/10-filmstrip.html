<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>10 · Filmstrip Coverflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060608; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Ambient blurred backdrop = the currently-centered photo, so the room glows with its color. */
  #backdrop { position: fixed; inset: -10%; background-size: cover; background-position: center;
    filter: blur(60px) brightness(0.4) saturate(1.3); transform: scale(1.15); transition: background-image .6s; }
  #backdropB { position: fixed; inset: -10%; background-size: cover; background-position: center;
    filter: blur(60px) brightness(0.4) saturate(1.3); transform: scale(1.15); opacity: 0; transition: opacity 1.2s ease; }
  #track { position: fixed; top: 0; bottom: 0; left: 50%; display: flex; align-items: center; gap: 60px;
    will-change: transform; transition: transform 1.4s cubic-bezier(0.22,1,0.36,1); }
  .slide { position: relative; flex: 0 0 auto; height: 62vh; border-radius: 10px; overflow: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.9); transition: transform 1.4s cubic-bezier(0.22,1,0.36,1), opacity 1.4s ease, filter 1.4s ease;
    transform: scale(0.7); opacity: 0.4; filter: brightness(0.55); }
  .slide.center { transform: scale(1.12); opacity: 1; filter: brightness(1); }
  .slide .img { height: 100%; background-size: cover; background-position: center; }
  #scrim { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 26%, transparent 72%, rgba(0,0,0,0.55) 100%); }
  #clock { position: fixed; bottom: 40px; left: 54px; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.7); z-index: 5; }
  #time { font-size: 72px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
  #date { font-size: 20px; font-weight: 300; opacity: .82; margin-top: 4px; }
  .badge { position: fixed; top: 44px; right: 54px; color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 1px; z-index: 5; }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="backdropB"></div>
  <div id="track"></div>
  <div id="scrim"></div>
  <div id="clock"><div id="time">--:--</div><div id="date"></div></div>
  <div class="badge">10 · FILMSTRIP COVERFLOW</div>
<script src="photos.js"></script>
<script src="engine.js"></script>
<script>
const track = document.getElementById("track");
const order = shuffled(PHOTOS);
const slides = [];
// Build a strip of slide elements (each sized to its aspect at 62vh height).
order.forEach(p => {
  const s = document.createElement("div"); s.className = "slide";
  const h = innerHeight * 0.62; const w = h * aspect(p);
  s.style.width = w + "px";
  const img = document.createElement("div"); img.className = "img";
  img.style.width = w + "px"; img.style.backgroundImage = `url("${photoUrl(p, 1400)}")`;
  s.appendChild(img); track.appendChild(s); slides.push({ el: s, w, photo: p });
});
let center = 0;
let bd = document.getElementById("backdrop"), bdB = document.getElementById("backdropB"), bdTop = false;

function center_to(i){
  slides.forEach((s,k)=>s.el.classList.toggle("center", k===i));
  // Shift the track so slide i sits at screen center (track's left edge is at 50vw).
  let offset = 0;
  for (let k=0;k<i;k++) offset += slides[k].w + 60;
  offset += slides[i].w/2;
  track.style.transform = `translateX(${-offset}px)`;
  // Crossfade the ambient backdrop to the centered photo.
  const url = photoUrl(slides[i].photo, 1000);
  const top = bdTop ? bd : bdB, bottom = bdTop ? bdB : bd;
  bottom.style.backgroundImage = `url("${url}")`;
  bottom.style.opacity = "1"; top.style.opacity = "0"; bdTop = !bdTop;
}
function loop(){ center = (center+1) % slides.length; center_to(center); setTimeout(loop, 5500); }
startClock(document.getElementById("time"), document.getElementById("date"));
bd.style.opacity = "1";
center_to(0);
setTimeout(loop, 3000);
addEventListener("resize", ()=>{
  slides.forEach(s=>{ const h=innerHeight*0.62; const w=h*aspect(s.photo); s.w=w; s.el.style.width=w+"px"; s.el.querySelector(".img").style.width=w+"px"; });
  center_to(center);
});
</script>
</body>
</html>
