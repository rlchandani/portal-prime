<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>08 · Polaroid Scatter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Georgia", serif;
    background: radial-gradient(130% 100% at 50% 0%, #2a2724 0%, #17150f 60%, #0d0b08 100%); }
  #table { position: fixed; inset: 0; }
  .polaroid { position: absolute; background: #fbfaf6; padding: 14px 14px 46px 14px; border-radius: 3px;
    box-shadow: 0 24px 50px -14px rgba(0,0,0,0.75); opacity: 0; will-change: transform, opacity;
    transition: opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1); }
  .polaroid.on { opacity: 1; }
  .polaroid .ph { display: block; background-size: cover; background-position: center; background-color: #ddd; }
  .polaroid .cap { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: #55503f;
    font-size: 15px; font-family: "Bradley Hand", "Segoe Script", cursive; }
  #clock { position: fixed; top: 40px; left: 54px; color: rgba(255,255,255,0.72); font-family: -apple-system, sans-serif; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  #time { font-size: 60px; font-weight: 200; letter-spacing: -1px; }
  #date { font-size: 18px; opacity: .8; }
  .badge { position: fixed; top: 44px; right: 54px; color: rgba(255,255,255,0.45); font-size: 15px; letter-spacing: 1px; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
  <div id="table"></div>
  <div id="clock"><div id="time">--:--</div><div id="date"></div></div>
  <div class="badge">08 · POLAROID SCATTER</div>
<script src="photos.js"></script>
<script src="engine.js"></script>
<script>
const table = document.getElementById("table");
let deck = shuffled(PHOTOS), di = 0;
const next = () => deck[di++ % deck.length];
const MAX = 7;
let live = [];
const CAPS = ["good times","summer '24","us","♥","don't forget","golden hour","home","the trip"];

function drop(){
  if (live.length >= MAX) {
    // Remove the oldest with a gentle fade+lift.
    const old = live.shift();
    old.style.opacity = "0"; old.style.transform += " translateY(-30px) rotate(0deg)";
    setTimeout(()=>old.remove(), 1000);
  }
  const p = next();
  const el = document.createElement("div"); el.className = "polaroid";
  // Portraits get a taller photo window; landscapes wider — like a real printed photo.
  const a = aspect(p);
  const pw = a >= 1 ? 300 : 240;
  const ph = Math.round(pw / a);
  const inner = document.createElement("div"); inner.className = "ph";
  inner.style.width = pw + "px"; inner.style.height = ph + "px";
  inner.style.backgroundImage = `url("${photoUrl(p, 900)}")`;
  const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = CAPS[Math.floor(Math.random()*CAPS.length)];
  el.appendChild(inner); el.appendChild(cap); table.appendChild(el);
  // Random scattered placement + tilt, biased toward center so nothing clips off-screen.
  const W=innerWidth,H=innerHeight;
  const x = W*0.12 + Math.random()*(W*0.62);
  const y = H*0.12 + Math.random()*(H*0.5);
  const rot = (Math.random()*2-1)*11;
  el.style.left = x+"px"; el.style.top = y+"px";
  el.style.transform = `rotate(${rot}deg) scale(0.86)`;
  requestAnimationFrame(()=>{ el.classList.add("on"); el.style.transform = `rotate(${rot}deg) scale(1)`; });
  live.push(el);
}

startClock(document.getElementById("time"), document.getElementById("date"));
for (let i=0;i<4;i++) setTimeout(drop, i*450);
setInterval(drop, 3500);
</script>
</body>
</html>
