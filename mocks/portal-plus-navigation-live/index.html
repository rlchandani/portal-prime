<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Immortal · browser navigation demo</title>
  <!-- Resolve the approved renderer's relative asset paths without copying its files. -->
  <base href="../portal-plus-complete/">
  <link rel="stylesheet" href="native.css">
  <link rel="stylesheet" href="complete.css">
  <link rel="stylesheet" href="../portal-plus-navigation-live/navigation.css">
</head>
<body>
  <div class="demo-toolbar">
    <strong>Browser navigation demo</strong>
    <span>Sample fixtures · no live Android or emulator</span>
    <button id="demo-back" type="button">← Back</button>
    <label>Settings appearance
      <select id="demo-theme"><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
    <a href="./" target="_blank" rel="noopener">Approved review ↗</a>
    <span id="demo-route" role="status" aria-live="polite">Loading fixtures…</span>
  </div>
  <div id="demo-viewport">
    <div id="navigation-device" aria-label="Portal+ browser navigation demonstration"></div>
  </div>
  <!-- The frozen renderer runs once in this hidden staging root. Its HTML is projected
       into retained visible panels; it never owns the visible header/sidebar/dock. -->
  <div id="device" hidden inert aria-hidden="true"></div>
  <script src="assets/icons.js"></script>
  <script src="tokens.js"></script>
  <script src="inventory.js"></script>
  <script src="fixtures.js"></script>
  <script src="model.js"></script>
  <script src="settings-tiers.js"></script>
  <script src="complete.js"></script>
  <script src="../portal-plus-navigation-live/navigation.js"></script>
</body>
</html>
