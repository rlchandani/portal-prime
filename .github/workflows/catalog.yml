name: Catalog validation

on:
  pull_request:
    paths:
      - "catalog.json"
      - "app/src/main/assets/catalog.json"
      - "scripts/validate_catalog.py"
      - "scripts/test_portal_catalog_parity.py"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "app/src/main/assets/catalog.json"
      - "scripts/validate_catalog.py"
      - "scripts/test_portal_catalog_parity.py"
      - ".github/workflows/catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bundled catalog validation
        run: python3 -m unittest discover -s scripts -p 'test_portal_catalog_parity.py'
      - name: Validate catalog (schema + network checks)
        run: python3 scripts/validate_catalog.py --network
