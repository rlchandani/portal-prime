apply plugin: 'com.android.application'

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.immortal.musicreceiver"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2902003
        versionName '0.29.0.2-pcm-preview.3'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

    }
    signingConfigs {
        isolatedPreview {
            storeFile file('../../signing/preview-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            // Parent can produce the same debug variant for authorized Family signing.
            signingConfig = project.hasProperty('unsignedPreview') ? null : signingConfigs.isolatedPreview
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Optional no-auth route: unchanged native executable from the public release APK.
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
    buildToolsVersion = '35.0.0'
    lint {
        disable 'MissingTranslation'
    }
    namespace 'de.badaix.snapcast'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
    // https://dl.google.com/dl/android/maven2/index.html
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // compile 'com.android.support:recyclerview-v7:23.1.1'
    implementation 'com.google.android.material:material:1.12.0'
}

