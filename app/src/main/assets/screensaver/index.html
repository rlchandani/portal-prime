<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Calder Screensaver</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* App host: no picker chrome (that's mock-only). Just the stage + shared clock overlay. */
  #hint { display: none; }
  #chrome-mode { display: none; } /* keep the mode label hidden on-device by default */
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5); font: 300 22px -apple-system, "Segoe UI", sans-serif; background: #000; z-index: 30; }
  /* Readiness already includes image decoding; reveal the prepared composition immediately. */
  #loading.hide { display: none; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="chrome-scrim"></div>
  <div id="chrome-vignette"></div>
  <div id="chrome-clock"><div id="chrome-time">--:--</div><div id="chrome-date"></div></div>
  <div id="chrome-mode"></div>
  <div id="loading">Loading your photos…</div>

<script src="photos.js"></script>
<script src="lib-engine.js"></script>
<script src="modes.js"></script>
<script src="mode-impls.js"></script>
<script src="scheduler.js"></script>
<script>
(async function () {
  const stage = document.getElementById("stage"), startupAt = performance.now();
  let engine = null, closed = false,
      requestedPause = new URLSearchParams(location.search).get("hostPaused") === "1",
      clockTimer = null, readyLogged = false, measurement = null, wakeStartup = null;
  function releaseStartup() {
    if (wakeStartup) { const wake = wakeStartup; wakeStartup = null; wake(); }
  }
  // Available during initial dimension measurement. This bridge belongs only to this asset page.
  window.immortalSlideshow = {
    next: () => engine && !closed ? engine.next() : false,
    previous: () => engine && !closed ? engine.previous() : false,
    pause: () => {
      requestedPause = true;
      if (measurement) measurement.abort();
      if (engine && !closed) engine.pause();
    },
    resume: () => {
      requestedPause = false; releaseStartup();
      if (engine && !closed) engine.resume();
    },
  };
  addEventListener("pagehide", () => {
    closed = true; clearInterval(clockTimer);
    if (measurement) measurement.abort();
    releaseStartup();
    if (engine) engine.stop();
  }, { once: true });

  // Mode + clock format from the host bridge (falls back to shuffle / 12h).
  function bridgeMode() {
    try { if (window.Android && window.Android.getMode) return window.Android.getMode() || "shuffle"; } catch (e) {}
    if (window.SS_CONFIG && window.SS_CONFIG.mode) return window.SS_CONFIG.mode;
    return "shuffle";
  }
  function use24() {
    try { if (window.Android && window.Android.use24Hour) return !!window.Android.use24Hour(); } catch (e) {}
    return false;
  }
  // Per-photo dwell in seconds (host bridge). 0 → engine uses its own sensible default.
  function intervalSec() {
    try { if (window.Android && window.Android.getIntervalSec) return window.Android.getIntervalSec() || 0; } catch (e) {}
    if (window.SS_CONFIG && window.SS_CONFIG.intervalSec) return window.SS_CONFIG.intervalSec;
    return 0;
  }
  function photoMotion() {
    try {
      if (window.Android && window.Android.getPhotoMotion)
        return window.Android.getPhotoMotion() !== false;
    } catch (_) {}
    return !window.SS_CONFIG || window.SS_CONFIG.photoMotion !== false;
  }

  // When the host renders its own native clock/overlays on top (?nativeClock=1), suppress the
  // engine's built-in clock + scrim so we don't draw two clocks. The engine is then purely the
  // photo layer; the app's Face overlay (clock face, calendar, now-playing) sits above it.
  const nativeClock = new URLSearchParams(location.search).has("nativeClock");
  if (nativeClock) {
    ["chrome-clock", "chrome-scrim", "chrome-mode"].forEach((id) => {
      const el = document.getElementById(id); if (el) el.style.display = "none";
    });
  } else {
    // Standalone (browser/dev): the engine draws its own clock honoring 24h.
    (function clock() {
      const timeEl = document.getElementById("chrome-time"), dateEl = document.getElementById("chrome-date");
      const h24 = use24();
      function tick() {
        const d = new Date();
        let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, "0");
        if (h24) { timeEl.textContent = `${String(h).padStart(2,"0")}:${m}`; }
        else { const hh = h % 12 || 12; timeEl.textContent = `${hh}:${m}`; }
        dateEl.textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      }
      tick(); clockTimer = setInterval(tick, 1000);
    })();
  }

  // These fixed modes select "any" photos and apply aspect-dependent geometry only
  // after t.load: the admitted display decode records dimensions before publication.
  // Keep probes for Shuffle's appetites, orientation-based selection, and Filmstrip's
  // bounded admission; bypassing those could change pairing or increase display loads.
  const displayMetadataModes = new Set(["kenBurns", "framed", "push", "memories", "polaroid"]);
  // Cap required initial probes so a huge library doesn't stall the start.
  for (;;) {
    // A retained hidden/night host admits no orientation loads or new scene.
    while (requestedPause && !closed) await new Promise(resolve => { wakeStartup = resolve; });
    if (closed) return;
    if (window.premeasureAll && !displayMetadataModes.has(bridgeMode())) {
      let measureTimer;
      const owner = new AbortController();
      measurement = owner;
      try {
        await Promise.race([window.premeasureAll(6, owner.signal),
          new Promise(resolve => {
            measureTimer = setTimeout(() => { owner.abort(); resolve(); }, 1500);
          })]);
      } catch (_) {}
      finally {
        clearTimeout(measureTimer); owner.abort();
        if (measurement === owner) measurement = null;
      }
    }
    if (!requestedPause || closed) break;
  }
  if (closed) return;

  if (!window.PHOTOS || !window.PHOTOS.length) {
    document.getElementById("loading").textContent = "No photos to show";
    document.getElementById("loading").classList.remove("hide");
    return;
  }

  engine = SS.startEngine({
    stage,
    mode: bridgeMode(),
    intervalSec: intervalSec(),
    photoMotion: photoMotion(),
    onMode: (_, modeId) => {
      if (modeId === "framed" || modeId === "mosaic") paperSurface(true);
      // Code-defined style only, once per decoded promotion; optional diagnostics never stop playback.
      try {
        if (window.Android && window.Android.reportPresentedStyle) window.Android.reportPresentedStyle(modeId);
      } catch (_) {}
    },
    onSettled: modeId => paperSurface(modeId === "framed" || modeId === "mosaic"),
    onReady: () => {
      document.getElementById("loading").classList.add("hide");
      if (!readyLogged) {
        readyLogged = true;
        // One readiness event per frame; no photo URLs or per-animation logging.
        console.info("Slideshow ready mode=" + bridgeMode() + " photos=" + window.PHOTOS.length +
          " startupMs=" + Math.round(performance.now() - startupAt));
      }
    },
  });
  if (requestedPause) engine.pause();
  function paperSurface(enabled) {
    // Keep native/standalone contrast until outgoing Paper pixels have actually retired.
    try { if (document.body) document.body.classList.toggle("photo-paper", enabled); } catch (_) {}
    try {
      if (window.Android && window.Android.paperSurfaceChanged) window.Android.paperSurfaceChanged(enabled);
    } catch (_) {}
  }
})();
</script>
</body>
</html>
